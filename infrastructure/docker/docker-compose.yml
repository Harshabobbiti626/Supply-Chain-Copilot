version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Primary Relational & Vector Database (PostgreSQL 16 with pgvector)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supplychain-postgres
    restart: always
    environment:
      POSTGRES_DB: supplychain_db
      POSTGRES_USER: sc_user
      POSTGRES_PASSWORD: sc_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sc_user -d supplychain_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sc-network

  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - no Zookeeper required)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: supplychain-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sc-network

  # ---------------------------------------------------------------------------
  # In-Memory Cache (Redis 7) for Geospatial queries & rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: supplychain-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sc-network

  # ---------------------------------------------------------------------------
  # Core Backend (Java 21 / Spring Boot 3)
  # ---------------------------------------------------------------------------
  core-backend:
    build:
      context: ../../services/core-backend
      dockerfile: Dockerfile
    container_name: supplychain-core-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/supplychain_db
      SPRING_DATASOURCE_USERNAME: sc_user
      SPRING_DATASOURCE_PASSWORD: sc_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AI_ENGINE_BASE_URL: http://ai-engine:8000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - sc-network

  # ---------------------------------------------------------------------------
  # AI & Route Optimization Engine (Python 3.11 / FastAPI)
  # ---------------------------------------------------------------------------
  ai-engine:
    build:
      context: ../../services/ai-engine
      dockerfile: Dockerfile
    container_name: supplychain-ai-engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sc_user:sc_password@postgres:5432/supplychain_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sc-network

  # ---------------------------------------------------------------------------
  # Frontend Web Client (React 19 / Vite / Nginx)
  # ---------------------------------------------------------------------------
  web-client:
    build:
      context: ../../apps/web-client
      dockerfile: Dockerfile
    container_name: supplychain-web-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - core-backend
    networks:
      - sc-network

volumes:
  pgdata:
    driver: local

networks:
  sc-network:
    driver: bridge
