app:
  scheduling:
    enabled: false

spring:
  application:
    name: supplychain-copilot-core-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      retries: 0
  flyway:
    enabled: false

ai-engine:
  base-url: http://localhost:8000
